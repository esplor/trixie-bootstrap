---
# Base packages every fresh trixie machine wants, installed against this machine.
# Run with: uv run ansible-playbook base.yml
- name: Base packages for a fresh trixie machine
  hosts: localhost
  connection: local
  become: true
  vars:
    # The apt module needs python3-apt, which is built for the system interpreter.
    # Pin it here so the module finds the bindings instead of respawning out of .venv.
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    # One deb822 file owns every Debian suite, backports included, in place of the
    # installer's one-line sources.list. Moved aside rather than deleted, the way
    # "apt modernize-sources" does it, so a local mirror or extra line is not lost.
    - name: Install the Debian apt sources
      ansible.builtin.copy:
        src: etc/apt/sources.list.d/debian.sources
        dest: /etc/apt/sources.list.d/debian.sources
        mode: "0644"
      register: debian_sources

    - name: Move the one-line sources.list aside
      ansible.builtin.command:
        cmd: mv /etc/apt/sources.list /etc/apt/sources.list.bak
        removes: /etc/apt/sources.list
      register: sources_list_moved

    - name: Refresh the apt cache for the new sources
      ansible.builtin.apt:
        update_cache: true
      when: debian_sources.changed or sources_list_moved.changed

    # Before the package, so its postinst starts zramswap with these settings and dpkg
    # keeps this file over its own. zramswap only reads it at start, and restarting it on
    # a running machine means a swapoff that pulls everything swapped back into RAM, so an
    # existing install picks it up at the next boot instead.
    - name: Configure zramswap
      ansible.builtin.copy:
        src: etc/default/zramswap
        dest: /etc/default/zramswap
        mode: "0644"

    - name: Set vm.swappiness for zram
      ansible.builtin.copy:
        src: etc/sysctl.d/99-swappiness.conf
        dest: /etc/sysctl.d/99-swappiness.conf
        mode: "0644"
      notify: Reload sysctl settings

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - bash-completion
          - bat  # Debian renames the binary to batcat
          - btop
          - build-essential
          - htop
          - psmisc
          - ripgrep
          - rsync
          - screen  # Server requirement
          - stow
          - tree
          - zram-tools
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure ~/.config exists, so stow links into it instead of folding it
      # Play-level become is root, whose HOME is /root, and gathered facts keep saying
      # /root even under become: false. lookup() reads the controller's env, which is
      # right because this play only ever targets localhost.
      become: false
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.config"
        state: directory
        mode: "0755"

  handlers:
    # systemd-sysctl rather than the sysctl binary, which is procps and not on a minimal
    # install.
    - name: Reload sysctl settings
      ansible.builtin.systemd_service:
        name: systemd-sysctl
        state: restarted
