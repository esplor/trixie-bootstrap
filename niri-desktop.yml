---
# The niri desktop: the compositor, xwayland-satellite and the noctalia shell built from
# source, plus every package the dotfiles' niri, noctalia and kitty configs reach for at
# runtime.
#
# Run with: uv run ansible-playbook niri-desktop.yml
# Upgrade by bumping niri_version, xwayland_satellite_version or noctalia_version; a
# build only runs when the installed version differs.
#
# Configuration is not this playbook's business. ~/.config/{niri,noctalia,kitty} are stow
# symlinks into ~/.dotfiles, so this installs software and stops there.
#
# Unlike the other playbooks here, this one names every package it needs, including ones
# base.yml or bootstrap.sh already installed. A playbook that silently depends on another
# playbook having run is a trap on the first machine where it has not.
- name: Niri desktop
  hosts: localhost
  connection: local
  vars:
    # The apt module needs python3-apt, which is built for the system interpreter.
    # Pin it here so the module finds the bindings instead of respawning out of .venv.
    ansible_python_interpreter: /usr/bin/python3
    niri_version: v26.04
    xwayland_satellite_version: v0.8.2
    noctalia_version: v5.1.0
    rust_version: 1.96.0
    nerd_fonts_version: v3.5.1
    # Only the families the dotfiles' configs name: CascadiaCode for kitty, which Nerd
    # Fonts renames to the CaskaydiaCove that kitty.conf actually asks for, and FiraCode
    # for alacritty.
    nerd_fonts:
      - CascadiaCode
      - FiraCode
    font_dir: /usr/local/share/fonts
    # lookup() rather than a fact, which is right in the same way for every task
    # regardless of who it runs as. See base.yml.
    cargo: "{{ lookup('env', 'HOME') }}/.cargo/bin/cargo"
    rustup: "{{ lookup('env', 'HOME') }}/.cargo/bin/rustup"
    # cargo defaults its job count to the core count and ninja to the core count plus
    # two, so RAM demand scales with cores rather than with RAM. The heaviest single job
    # measured is one rustc on niri's lib crate at about 2 GB, so this allows one job per
    # 2 GB, never more than there are cores and never fewer than one. Found by
    # OOM-killing a 2 GB, 2-core VM mid-build, where the same build then succeeded on the
    # retry. See docs/playbooks/niri-desktop.md.
    build_jobs: >-
      {{ [[ansible_facts['memtotal_mb'] // 2000,
           ansible_facts['processor_vcpus']] | min, 1] | max }}
    xwayland_satellite_stamp: /usr/local/share/xwayland-satellite-version
  tasks:
    - name: Install the desktop packages
      become: true
      ansible.builtin.apt:
        name:
          - brightnessctl  # the dotfiles' bl-* shell functions; noctalia has its own
          - ca-certificates  # TLS for the rustup, font and Chrome downloads
          - curl  # fetches the rustup installer
          # Audio effects on the output, driven by the dotfiles' easyeffects presets.
          # The LV2 plugins that implement most of its effects are only Recommends, so
          # they are named: lsp-plugins-lv2 for the equalizer and the dynamics, mda-lv2
          # and zam-plugins for the rest. Without them the effects are listed but greyed
          # out as not installed, and a preset that uses one silently skips it.
          # calf-plugins is the one alternative in that Recommends, and the only source
          # of the bass enhancer the dotfiles' output preset uses.
          - calf-plugins
          - easyeffects
          - lsp-plugins-lv2
          - mda-lv2
          - zam-plugins
          - fontconfig  # fc-cache, below
          # The Secret portal niri-portals.conf prefers, and the Secret Service noctalia
          # keeps its credentials and encrypted state in.
          - gnome-keyring
          - gnupg  # dearmors the Chrome signing key, below
          # A patchbay for links noctalia cannot make, such as one app to several
          # outputs at once; noctalia only moves a stream to a single output.
          - helvum
          - kitty  # Mod+Shift+Return
          # Card profiles: Bluetooth A2DP against headset mode, HDMI output. noctalia
          # routes streams and sets volumes but cannot switch a card's profile.
          - pavucontrol
          # Debian's recommended set for an audio desktop, and a metapackage so every
          # piece arrives as a Depends. Naming pipewire and wireplumber directly would
          # lose the two that are only Recommends of wireplumber: pipewire-pulse, which
          # is the PulseAudio server pavucontrol and every browser and Flatpak app
          # actually talk to, and libspa-0.2-bluetooth, without which bluetooth audio is
          # silent. noctalia refuses to start without the pipewire daemon.
          - pipewire-audio
          # deb822_repository parses and writes .sources files through python3-debian and
          # fails outright without it, the same way the apt module needs python3-apt. Named
          # here rather than letting the module's install_python_debian fetch it, so the
          # dependency is visible and goes through --no-install-recommends like the rest.
          - python3-debian
          - power-profiles-daemon  # noctalia's power profile control
          # Realtime scheduling for pipewire, pipewire-pulse and wireplumber. Only a
          # Recommends of pipewire-bin, which pipewire-audio does not fix, and without it
          # all three log "RTKit error: ServiceUnknown" and run at normal priority.
          - rtkit
          # Here rather than in base.yml because the stowed tmux.conf names palette
          # indices, which noctalia's kitty template fills in. Without the desktop tmux
          # still runs, it just takes its colors from whatever terminal is attached.
          - tmux
          - unzip  # unpacks the Nerd Font archives, below
          - xdg-desktop-portal
          - xdg-desktop-portal-gnome  # niri-portals.conf prefers gnome, then gtk
          - xdg-desktop-portal-gtk
          - xwayland  # xwayland-satellite runs it
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure the system font directories exist
      become: true
      ansible.builtin.file:
        path: "{{ font_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ nerd_fonts }}"

    # System-wide rather than the ~/.local/share/fonts that getnf uses, so a greeter and
    # any other user get the same fonts.
    #
    # The creates: guard is what stops a re-run from re-downloading ~95 MB of zips. It
    # cannot point at the directory, which now always exists, and the archives carry no
    # version marker of their own, so the next task writes one for it to find. Putting the
    # version in the stamp's name rather than its content is what makes bumping
    # nerd_fonts_version pull the new release.
    - name: Install the Nerd Fonts
      become: true
      ansible.builtin.unarchive:
        src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item }}.zip"
        dest: "{{ font_dir }}/{{ item }}"
        remote_src: true
        creates: "{{ font_dir }}/{{ item }}/.nerd-fonts-{{ nerd_fonts_version }}"
      loop: "{{ nerd_fonts }}"
      notify: Rebuild the font cache

    - name: Stamp the installed Nerd Fonts version
      become: true
      ansible.builtin.copy:
        content: "{{ nerd_fonts_version }}\n"
        dest: "{{ font_dir }}/{{ item }}/.nerd-fonts-{{ nerd_fonts_version }}"
        mode: "0644"
      loop: "{{ nerd_fonts }}"

    # Google's own package rewrites /etc/apt/sources.list.d/google-chrome.sources on every
    # upgrade ("THIS FILE IS AUTOMATICALLY CONFIGURED"), so use the URI, format and keyring
    # path it uses. Writing the older google-chrome.list instead leaves two sources for the
    # same suite once Chrome has updated itself once.
    - name: Check whether Google Chrome is installed
      ansible.builtin.command:
        cmd: dpkg-query -W -f=${Status} google-chrome-stable
      register: chrome_installed
      changed_when: false
      failed_when: false

    - name: Fetch the Google signing key
      become: true
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /usr/share/keyrings/google-chrome.asc
        mode: "0644"

    - name: Dearmor the Google signing key
      become: true
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg /usr/share/keyrings/google-chrome.asc
        creates: /usr/share/keyrings/google-chrome.gpg

    # Only needed until Chrome is in, and actively harmful after. install_deb822_sources
    # in the postinst recreates this file whenever it already exists, and it always does
    # here, because apt cannot install the package without the repository first. Both
    # files describe the same repository and differ only in field order, the
    # X-Repolib-Name value and a header, so re-adding it every run reports a change
    # nobody made, once per Chrome upgrade forever. Google's header says the file is not
    # to be edited by hand, so past the first install it belongs to Chrome.
    - name: Add the Google Chrome apt repository
      become: true
      when: "'install ok installed' not in chrome_installed.stdout"
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: deb
        uris: https://dl.google.com/linux/chrome-stable/deb/
        suites: stable
        components: main
        architectures: amd64
        signed_by: /usr/share/keyrings/google-chrome.gpg
        state: present
        enabled: true

    - name: Install Google Chrome
      become: true
      ansible.builtin.apt:
        name: google-chrome-stable
        state: present
        install_recommends: false
        update_cache: true

    # By absolute path, so a stray niri elsewhere on root's PATH cannot answer for the build.
    - name: Check which niri is installed
      ansible.builtin.command: /usr/local/bin/niri --version
      register: niri_installed
      changed_when: false
      failed_when: false

    # xwayland-satellite has no version flag at all; --version panics with "Unrecognized
    # argument". So the install step records the ref it built, and this reads it back.
    - name: Check whether the xwayland-satellite stamp exists
      ansible.builtin.stat:
        path: "{{ xwayland_satellite_stamp }}"
      register: xwayland_satellite_stat

    # The stamp alone would let a machine that installed to /usr/bin before the move to
    # /usr/local/bin skip the build, so the binary has to be there too.
    - name: Check whether the xwayland-satellite binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/xwayland-satellite
      register: xwayland_satellite_bin

    - name: Read the installed xwayland-satellite version
      ansible.builtin.slurp:
        src: "{{ xwayland_satellite_stamp }}"
      register: xwayland_satellite_installed
      when: xwayland_satellite_stat.stat.exists

    # By absolute path, so a packaged noctalia on PATH later cannot answer for the build.
    - name: Check which noctalia is installed
      ansible.builtin.command: /usr/local/bin/noctalia --version
      register: noctalia_installed
      changed_when: false
      failed_when: false

    - name: Decide what needs building
      ansible.builtin.set_fact:
        niri_needs_build: >-
          {{ (niri_version | default('') | regex_replace('^v', ''))
             not in (niri_installed.stdout | default('')) }}
        xwayland_satellite_needs_build: >-
          {{ not xwayland_satellite_bin.stat.exists
             or not xwayland_satellite_stat.stat.exists
             or (xwayland_satellite_installed.content | default('') | b64decode | trim)
                != xwayland_satellite_version }}
        # Prints "noctalia v5.1.0 (<git describe>)", leading v included.
        noctalia_needs_build: >-
          {{ (noctalia_version | default(''))
             not in (noctalia_installed.stdout | default('')) }}

    # Everything from here to the end of the builds is skipped on a machine that is already
    # up to date, so a re-run does not pull a pile of -dev packages onto it.
    - name: Install the build dependencies
      become: true
      # Upstream's own lists: DEPS_APT in niri's .github/workflows/ci.yml, and
      # .github/workflows/ubuntu.dockerfile plus the README in xwayland-satellite.
      # build-essential covers upstream's gcc and gives cargo a linker; git is what
      # ansible.builtin.git shells out to. pkg-config, libglib2.0-dev and libcairo2-dev
      # are Depends of libpango1.0-dev, and libxcb1-dev of libxcb-cursor-dev, so naming
      # them would be noise. See docs/playbooks/niri-desktop.md.
      ansible.builtin.apt:
        name:
          - build-essential
          - clang
          - git
          - libdbus-1-dev
          - libdisplay-info-dev
          - libegl1-mesa-dev
          - libgbm-dev
          - libinput-dev
          - libpango1.0-dev
          - libpipewire-0.3-dev
          - libseat-dev
          - libsystemd-dev
          - libudev-dev
          - libwayland-dev
          - libxcb-cursor-dev
          - libxkbcommon-dev
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
      when: niri_needs_build or xwayland_satellite_needs_build

    - name: Install the rust toolchain
      when: niri_needs_build or xwayland_satellite_needs_build
      block:
        - name: Check whether rustup is installed
          ansible.builtin.stat:
            path: "{{ rustup }}"
          register: rustup_stat

        # --no-modify-path for the same reason bootstrap.sh passes UV_NO_MODIFY_PATH=1:
        # the shell rc files are stowed symlinks into the dotfiles repo, and the installer
        # would otherwise append to six of them. Every cargo call below uses an absolute
        # path instead of relying on PATH.
        - name: Install rustup
          when: not rustup_stat.stat.exists
          block:
            # A directory, not a tempfile. get_url defaults to force: false and skips
            # entirely when dest already exists, so downloading onto a path tempfile had
            # just created left an empty 0600 file behind and the run died on it.
            - name: Create a build directory for rustup
              ansible.builtin.tempfile:
                state: directory
                suffix: rustup
              register: rustup_build

            - name: Download the rustup installer
              ansible.builtin.get_url:
                url: https://sh.rustup.rs
                dest: "{{ rustup_build.path }}/rustup-init.sh"
                mode: "0755"

            # Run through sh rather than executing it, so a machine that mounts /tmp
            # noexec still works.
            - name: Run the rustup installer
              ansible.builtin.command:
                cmd: >-
                  sh {{ rustup_build.path }}/rustup-init.sh
                  --no-modify-path --profile minimal
                  --default-toolchain {{ rust_version }} -y
                creates: "{{ rustup }}"
          always:
            - name: Remove the rustup build directory
              ansible.builtin.file:
                path: "{{ rustup_build.path }}"
                state: absent
              when: rustup_build.path is defined

        # rustup-init refuses to run over an existing install, so bumping rust_version on
        # a machine that already has rustup goes through rustup itself, which installs the
        # toolchain if it is not there yet.
        - name: Select rust {{ rust_version }}
          ansible.builtin.command:
            cmd: "{{ rustup }} default {{ rust_version }}"
          register: rustup_default
          changed_when: "'unchanged' not in (rustup_default.stdout + rustup_default.stderr)"

    - name: Build and install xwayland-satellite {{ xwayland_satellite_version }}
      # become is scoped to the install steps, so the clone and the build tree stay owned
      # by the invoking user and cargo uses that user's registry cache.
      when: xwayland_satellite_needs_build
      block:
        # /var/tmp, not the /tmp that tempfile defaults to. /tmp is a tmpfs here, so a
        # cargo target/ tree built there is held in RAM: niri's is 3.8 GB and this one
        # 921 MB, which OOM-kills a 4 GB machine outright. /var/tmp is the FHS home for
        # exactly this, temporary data too large or too long-lived for /tmp.
        - name: Create a build directory for xwayland-satellite
          ansible.builtin.tempfile:
            state: directory
            suffix: xwayland-satellite
            path: /var/tmp
          register: xwayland_satellite_build

        - name: Clone xwayland-satellite {{ xwayland_satellite_version }}
          ansible.builtin.git:
            repo: https://github.com/Supreeeme/xwayland-satellite
            dest: "{{ xwayland_satellite_build.path }}"
            version: "{{ xwayland_satellite_version }}"
            depth: 1
            single_branch: true

        - name: Build xwayland-satellite
          ansible.builtin.command:
            cmd: "{{ cargo }} build --release"
            chdir: "{{ xwayland_satellite_build.path }}"
          changed_when: true
          environment:
            CARGO_BUILD_JOBS: "{{ build_jobs }}"

        # niri spawns the binary directly off systemd's user PATH, which includes
        # /usr/local/bin, so the standalone xwayland-satellite.service unit is not needed.
        - name: Install xwayland-satellite into /usr/local/bin
          become: true
          ansible.builtin.copy:
            src: "{{ xwayland_satellite_build.path }}/target/release/xwayland-satellite"
            dest: /usr/local/bin/xwayland-satellite
            mode: "0755"
            remote_src: true

        - name: Record the installed xwayland-satellite version
          become: true
          ansible.builtin.copy:
            content: "{{ xwayland_satellite_version }}\n"
            dest: "{{ xwayland_satellite_stamp }}"
            mode: "0644"
      always:
        # In always, so a failed build does not leave its tree behind either.
        - name: Remove the xwayland-satellite build directory
          ansible.builtin.file:
            path: "{{ xwayland_satellite_build.path }}"
            state: absent
          when: xwayland_satellite_build.path is defined

    - name: Build and install niri {{ niri_version }}
      when: niri_needs_build
      block:
        # /var/tmp for the same reason as the xwayland-satellite build above.
        - name: Create a build directory for niri
          ansible.builtin.tempfile:
            state: directory
            suffix: niri
            path: /var/tmp
          register: niri_build
        - name: Clone niri {{ niri_version }}
          ansible.builtin.git:
            repo: https://github.com/YaLTeR/niri
            dest: "{{ niri_build.path }}"
            version: "{{ niri_version }}"
            depth: 1
            single_branch: true

        - name: Build niri
          ansible.builtin.command:
            cmd: "{{ cargo }} build --release"
            chdir: "{{ niri_build.path }}"
          changed_when: true
          environment:
            CARGO_BUILD_JOBS: "{{ build_jobs }}"

        # The other three resource destinations come from systemd and xdg-desktop-portal,
        # but nothing installed here provides this one: it normally arrives with a display
        # manager, and niri's own .deb ships it. copy does not create parents the way the
        # install -D in the notebook script did, so make it first.
        - name: Ensure the wayland-sessions directory exists
          become: true
          ansible.builtin.file:
            path: /usr/share/wayland-sessions
            state: directory
            mode: "0755"

        - name: Install the niri resource files
          become: true
          ansible.builtin.copy:
            src: "{{ niri_build.path }}/{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "0644"
            remote_src: true
          loop:
            - src: resources/niri.desktop
              dest: /usr/share/wayland-sessions/niri.desktop
            - src: resources/niri-portals.conf
              dest: /usr/share/xdg-desktop-portal/niri-portals.conf
            - src: resources/niri.service
              dest: /usr/lib/systemd/user/niri.service
            - src: resources/niri-shutdown.target
              dest: /usr/lib/systemd/user/niri-shutdown.target

        # /usr/local, as upstream's manual-installation table says, next to noctalia. The
        # resource files still go to /usr, where systemd and display managers look, and are
        # used verbatim: niri.service's bare "ExecStart=niri" and niri.desktop's
        # "Exec=niri-session" resolve via /usr/local/bin on the PATH.
        #
        # Last, deliberately. "niri --version" is what the guard at the top of this play
        # reads, so installing the binary before the resource files would let a failure
        # in between satisfy the guard and make the next run skip the whole block.
        - name: Install the niri binaries into /usr/local/bin
          become: true
          ansible.builtin.copy:
            src: "{{ niri_build.path }}/{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "0755"
            remote_src: true
          loop:
            - src: target/release/niri
              dest: /usr/local/bin/niri
            - src: resources/niri-session
              dest: /usr/local/bin/niri-session
      always:
        - name: Remove the niri build directory
          ansible.builtin.file:
            path: "{{ niri_build.path }}"
            state: absent
          when: niri_build.path is defined

    # trixie does not package noctalia at all. Its own APT repository has a trixie suite,
    # but it tracks the latest release and is signed by a third party's key, so the pinned
    # tag is built here the same way as niri. See docs/playbooks/niri-desktop.md.
    # noctalia generates code from ext-background-effect-v1.xml, which wayland-protocols
    # gained in 1.45; trixie has 1.44. Backports has 1.47, and a backports suite is
    # NotAutomatic, so adding it moves nothing else on the machine off trixie.
    - name: Add the trixie-backports apt repository
      become: true
      ansible.builtin.deb822_repository:
        name: debian-backports
        types: deb
        uris: http://deb.debian.org/debian
        suites: trixie-backports
        components: main
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present
        enabled: true
      when: noctalia_needs_build

    # A task of its own, not update_cache on the install below. The apt module applies
    # default_release before it refreshes the cache, so on the run that adds the source
    # apt rejects trixie-backports as "not available in the sources" and never gets as
    # far as the update that would have made it available. No cache_valid_time either:
    # the cache has to see the source that was just added.
    - name: Refresh the apt cache for trixie-backports
      become: true
      ansible.builtin.apt:
        update_cache: true
      when: noctalia_needs_build

    # latest rather than present, so a machine that already has trixie's 1.44 is moved
    # up rather than left there.
    - name: Install wayland-protocols from trixie-backports
      become: true
      ansible.builtin.apt:
        name: wayland-protocols
        default_release: trixie-backports
        state: latest
        install_recommends: false
      when: noctalia_needs_build

    - name: Install the noctalia build dependencies
      become: true
      # BUILDING.md's Debian list, minus just (meson is called directly) and
      # wayland-protocols (above), plus the two it leaves implicit, and with one swap.
      # Every one is a hard dependency() in meson.build except jemalloc, which is auto
      # and made required below so it cannot silently drop.
      ansible.builtin.apt:
        name:
          - g++  # C++23; trixie's 14 clears the GCC 13 floor
          - git  # ansible.builtin.git, and meson stamps the revision with git describe
          - libcairo2-dev
          # Not upstream's libcurl4-openssl-dev: trixie's libqalculate-dev Depends on
          # the gnutls flavour, the two Conflict, and apt refuses the whole list. Either
          # provides the libcurl pkg-config module meson asks for.
          - libcurl4-gnutls-dev
          - libegl-dev
          - libfontconfig-dev
          - libfreetype-dev
          - libgles-dev
          - libglib2.0-dev
          - libharfbuzz-dev
          - libical-dev
          - libjemalloc-dev
          - libjxl-dev
          - libmd4c-dev
          - libpam0g-dev  # the lock screen
          - libpango1.0-dev
          - libpipewire-0.3-dev
          - libpolkit-agent-1-dev
          - libpolkit-gobject-1-dev
          - libqalculate-dev  # the launcher calculator
          - librsvg2-dev
          - libsdbus-c++-dev
          - libsecret-1-dev
          - libsndfile1-dev
          - libsodium-dev
          - libstb-dev  # must ship stb/stb_image_resize2.h; trixie's does
          - libtomlplusplus-dev
          - libwayland-dev  # Depends on libwayland-bin, hence wayland-scanner
          - libwebp-dev
          - libwireplumber-0.5-dev
          - libxkbcommon-dev
          - libxml2-dev
          - meson
          - nlohmann-json3-dev
          - pkgconf
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
      when: noctalia_needs_build

    - name: Build and install noctalia {{ noctalia_version }}
      when: noctalia_needs_build
      block:
        - name: Create a build directory for noctalia
          ansible.builtin.tempfile:
            state: directory
            suffix: noctalia
            path: /var/tmp
          register: noctalia_build

        - name: Clone noctalia {{ noctalia_version }}
          ansible.builtin.git:
            repo: https://github.com/noctalia-dev/noctalia
            dest: "{{ noctalia_build.path }}"
            version: "{{ noctalia_version }}"
            depth: 1
            single_branch: true

        # PACKAGING.md's recommended configure, not the justfile's: that one adds
        # -Db_lto=true, which raises the link's memory peak for a build that already has
        # to fit a small VM. Tests are disabled outright: auto happens to mean off for a
        # release build today, but that is upstream's rule to change, not this playbook's.
        # The prefix is baked into the binary as the asset lookup path, so install with
        # the prefix configured here.
        - name: Configure the noctalia build
          ansible.builtin.command:
            cmd: >-
              meson setup build
              --prefix=/usr/local
              --buildtype=release
              -Dtests=disabled
              -Djemalloc=enabled
            chdir: "{{ noctalia_build.path }}"
          changed_when: true

        - name: Build noctalia
          ansible.builtin.command:
            cmd: meson compile -C build -j {{ build_jobs }}
            chdir: "{{ noctalia_build.path }}"
          changed_when: true

        # The binary, the assets tree it needs at runtime, a .desktop file and an icon,
        # all under /usr/local. No systemd unit ships and none is written: starting it is
        # the dotfiles' niri config's business.
        - name: Install noctalia into /usr/local
          become: true
          ansible.builtin.command:
            cmd: meson install -C build --no-rebuild
            chdir: "{{ noctalia_build.path }}"
          changed_when: true
      always:
        - name: Remove the noctalia build directory
          ansible.builtin.file:
            path: "{{ noctalia_build.path }}"
            state: absent
          when: noctalia_build.path is defined

    # No "systemctl --user daemon-reload" here, though niri-build.sh ended with one. It is
    # wrong for this playbook. See docs/playbooks/niri-desktop.md.

  handlers:
    - name: Rebuild the font cache
      become: true
      ansible.builtin.command:
        cmd: fc-cache -f {{ font_dir }}
      changed_when: true
