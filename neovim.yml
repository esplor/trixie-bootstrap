---
# Build and install Neovim from source, the way ~/.debian-scripts/nvim-build.sh does it,
# but idempotent and self-cleaning. trixie ships 0.10, which is too old for the lazy.nvim
# config in the dotfiles.
#
# Run with: uv run ansible-playbook neovim.yml
# Upgrade by bumping nvim_version; the build only runs when the installed nvim differs.
- name: Neovim from source
  hosts: localhost
  connection: local
  vars:
    ansible_python_interpreter: /usr/bin/python3
    nvim_version: v0.12.5
    user_home: "{{ lookup('env', 'HOME') }}"
  tasks:
    # Unconditional, unlike the build deps below: these are what the dotfiles' config
    # needs at runtime, so a machine that already has the right nvim still wants them.
    #
    # Named in full, including packages base.yml and bootstrap.sh already install. A
    # playbook that leans on another playbook having run is a trap on the first machine
    # where it has not, and git is exactly that: it used to sit only in the version-gated
    # build block below, so a machine that already had the right nvim never got it, while
    # lazy.nvim shells out to git to clone plugins on every single start.
    - name: Install neovim runtime dependencies
      become: true
      ansible.builtin.apt:
        name:
          - build-essential  # telescope-fzf-native's build = "make", treesitter parsers
          - ca-certificates  # TLS for the lazy.nvim clones and mason's downloads
          - curl  # mason core util
          - fd-find  # snacks.picker.explorer, telescope; Debian names the binary fdfind
          - git  # lazy.nvim clones and updates every plugin through it
          - imagemagick  # image.nvim, to convert anything that is not already a PNG
          - libglib2.0-bin  # gio, the trash command snacks.explorer deletes through
          # lazy.nvim installs image.nvim as a luarock, so it bootstraps hererocks, which
          # compiles Lua 5.1 with -DLUA_USE_READLINE and then configures luarocks. Without
          # these two the compile dies on readline/readline.h, luarocks configure dies on
          # "Could not find 'unzip'", and every nvim start ends in "Too many rounds of
          # missing plugins". See docs/playbooks/neovim.md.
          - libreadline-dev
          - unzip
          - luarocks  # mason's luarocks manager; distinct from lazy.nvim's hererocks
          - python3-venv  # mason's PyPI installer runs -m venv before pipping a tool in
          - ripgrep  # Snacks.picker.grep() and telescope's live-grep both hard-require it
          - wget  # mason core util
          - wl-clipboard  # the "+ and "* registers
          - xdg-utils  # xdg-open, behind vim.ui.open
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    # The dotfiles' config expects ruff on PATH: conform formats with ruff_format
    # when it finds it (formatter.lua), and lsp.lua lists ruff among the servers. A
    # uv tool rather than leaving it to mason's PyPI venv, so the editor and the
    # shell share one ruff. Absolute path to uv for the same reason as everywhere
    # else here, and no become, so it installs into the invoking user's home.
    - name: Install ruff as a uv tool
      ansible.builtin.command:
        cmd: "{{ user_home }}/.local/bin/uv tool install ruff"
        creates: "{{ user_home }}/.local/bin/ruff"

    - name: Check which neovim is installed
      ansible.builtin.command: nvim --version
      register: nvim_installed
      changed_when: false
      failed_when: false

    - name: Build and install neovim {{ nvim_version }}
      # become is scoped to the two tasks that need root, so the clone and the build
      # tree stay owned by the invoking user.
      when: nvim_version | regex_replace('^v', '') not in (nvim_installed.stdout | default(''))
      block:
        - name: Install neovim build dependencies
          become: true
          ansible.builtin.apt:
            # Exactly upstream's list for this tag (BUILD.md, Ubuntu/Debian). nvim-build.sh
            # also installed unzip, luarocks and python3-venv; those three are mason
            # runtime dependencies, not build ones. See docs/playbooks/neovim.md.
            name:
              - build-essential
              - cmake
              - curl
              - gettext
              - git
              - ninja-build
            state: present
            install_recommends: false
            update_cache: true
            cache_valid_time: 3600

        - name: Create a build directory
          ansible.builtin.tempfile:
            state: directory
            suffix: neovim
          register: nvim_build

        - name: Clone neovim {{ nvim_version }}
          ansible.builtin.git:
            repo: https://github.com/neovim/neovim
            dest: "{{ nvim_build.path }}"
            version: "{{ nvim_version }}"
            depth: 1
            single_branch: true

        - name: Build neovim
          ansible.builtin.command:
            cmd: make CMAKE_BUILD_TYPE=RelWithDebInfo
            chdir: "{{ nvim_build.path }}"
          changed_when: true

        - name: Install neovim into /usr/local
          become: true
          ansible.builtin.command:
            cmd: make install
            chdir: "{{ nvim_build.path }}"
          changed_when: true
      always:
        # In always, so a failed build does not leave its tree behind either.
        - name: Remove the build directory
          ansible.builtin.file:
            path: "{{ nvim_build.path }}"
            state: absent
          when: nvim_build.path is defined
